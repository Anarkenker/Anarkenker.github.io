short_bio: >-
  <p>
    I am an undergraduate student in Computer Science and Technology at Southwest University,
    enrolled in the Science Innovation Experimental Class at Yuan Longping College.
    My research interests include <strong>computer vision, world models, AR/VR, and embodied intelligence</strong>.
    I am particularly interested in how visual perception and predictive models can support interaction
    in augmented reality and decision-making in robotics.
  </p>
  <p>
    Since May 2025, I have been conducting research with the Spatial Computing and Applications Lab (SCA Lab)
    at Southwest University, working on 3D semantic perception for mobile AR and world-model-guided
    control for dynamic AR label placement. I also lead the vision team at the university's GKD Robotics
    Innovation Laboratory, where I develop real-time perception, target tracking, and aiming systems
    for RoboMaster robots.
  </p>


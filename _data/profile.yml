short_bio: >-
  <p>
    I am a Computer Science and Technology undergraduate at Yuan Longping College, Southwest University.
    My research interests span <strong>computer vision, world models, AR/VR, and embodied intelligence</strong>.
    As a research assistant at HPG Lab, Peking University Shenzhen Graduate School,
    I study <strong>safety in agentic robotics</strong> under the supervision of
    <a href="https://nkliuyifang.github.io/index.html" target="_blank" rel="noopener noreferrer">Prof. Mengyuan Liu</a>.
  </p>
  <p>
    At Southwest University's SCA Lab, I work on 3D semantic perception and world-model-guided AR label placement
    with <a href="https://jingweiqu.github.io/" target="_blank" rel="noopener noreferrer">Prof. Jingwei Qu</a>
    and receive guidance from <a href="https://haibinling.github.io/" target="_blank" rel="noopener noreferrer">Prof. Haibin Ling</a> of Westlake University.
    I also lead the GKD RoboMaster vision team.
  </p>


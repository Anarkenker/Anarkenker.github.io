<div class="album-grid" aria-label="Photo albums">
    {% for album in site.data.gallery %}
    <a class="album-card" href="{{ album.url | relative_url }}" aria-label="Open {{ album.title | escape }} album, {{ album.photos.size }} photos">
        <img class="album-cover" src="{{ album.cover | relative_url }}" alt="{{ album.title | escape }} album cover" loading="lazy">
        <div class="album-previews" aria-hidden="true">
            {% for photo in album.photos offset:1 limit:3 %}
            <img src="{{ photo.image | relative_url }}" alt="" loading="lazy">
            {% endfor %}
        </div>
        <div class="p-3">
            <h2 class="h5 mb-1">{{ album.title | escape }}</h2>
            <p class="small text-muted mb-0">{{ album.date | escape }} &middot; {{ album.photos.size }} photos</p>
        </div>
    </a>
    {% endfor %}
</div>
